name: Publish Package to CDN

on:
  workflow_run:
    workflows: ["Publish Package to npmjs"]
    types: [completed]

  workflow_dispatch:

  # TEMP (SD-3134 testing): workflow_dispatch only works once this file is on the default branch,
  # so pushes to this branch run it instead. Remove before merging.
  push:
    branches: [feat/cdn-deploy-versioned-only]

permissions:
  contents: write # add the CDN snippet + SRI hash to the GitHub Release
  id-token: write # mint the OIDC token AWS exchanges for short-lived creds

jobs:
  publish:
    runs-on: ubuntu-latest

    # Gate: required reviewers on the `production` environment. Also scopes the
    # AWS secrets and the OIDC trust policy's `sub`.
    environment: production

    # Only after a successful npm publish from a Release — not a `next` pre-release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - name: Build library
        run: npm run build

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-publish-to-cdn-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # Merchants pin a version together with its SRI hash, so a published version must never change:
      # a re-run or manual dispatch with differing bytes would get their script blocked.
      # Needs s3:ListBucket on the bucket (prefix libs/*) — without it this step fails, never passes.
      - name: Refuse to overwrite a published version
        env:
          BUCKET: ${{ secrets.CDN_S3_BUCKET }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          PREFIX="libs/straumur-web-component/$VERSION/"
          # Prints "None" when the prefix is empty; a failed call (e.g. AccessDenied) exits non-zero under bash -e.
          FIRST=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$PREFIX" --max-items 1 --query 'Contents[0].Key' --output text)
          if [ "$FIRST" != "None" ]; then
            echo "::error::$PREFIX already exists on the CDN. Bump the version in package.json instead of republishing."
            exit 1
          fi

      - name: Upload versioned build (immutable)
        env:
          BUCKET: ${{ secrets.CDN_S3_BUCKET }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          DEST="s3://$BUCKET/libs/straumur-web-component/$VERSION/"
          # IIFE only: the ESM build leaves preact/@adyen/adyen-web as bare imports for a bundler to
          # resolve, so it can't load from a CDN <script type="module">.
          aws s3 cp dist/ "$DEST" \
            --recursive \
            --exclude "*" \
            --include "index.js" \
            --include "index.js.map" \
            --include "index.d.ts" \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors

      # The SRI hash only exists once this exact file is built, so it is published from here: into the
      # run summary and into the GitHub Release, whose "For the docs" block is pasted into the
      # release note in kvika/straumur-documentation (its "Installing" section).
      - name: Generate SRI hash and CDN snippet
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
        run: |
          if [ -z "$CDN_BASE_URL" ]; then
            echo "::error::Set the CDN_BASE_URL variable (e.g. https://d1234.cloudfront.net) on the GitHub environment."
            exit 1
          fi
          SRI="sha384-$(openssl dgst -sha384 -binary dist/index.js | openssl base64 -A)"
          URL="${CDN_BASE_URL%/}/libs/straumur-web-component/$VERSION/index.js"
          TAG="<script src=\"$URL\" integrity=\"$SRI\" crossorigin=\"anonymous\"></script>"

          # Between markers, so a re-run replaces the section instead of appending it twice.
          {
            echo "<!-- cdn-snippet:start -->"
            echo "## Straumur CDN"
            echo ""
            echo "Load this version with a pinned URL and its [Subresource Integrity](https://developer.mozilla.org/en-US/docs/Web/Security/Subresource_Integrity) hash:"
            echo ""
            echo '```html'
            echo "$TAG"
            echo '```'
            echo ""
            echo "<details><summary>For the docs release note</summary>"
            echo ""
            echo '````markdown'
            echo "## Installing"
            echo ""
            echo '```bash'
            echo "npm install straumur-web-component@^$VERSION"
            echo '```'
            echo ""
            echo "For the script tag, load this version from the Straumur CDN with its integrity hash:"
            echo ""
            echo '```html'
            echo "$TAG"
            echo '```'
            echo '````'
            echo ""
            echo "</details>"
            echo "<!-- cdn-snippet:end -->"
          } > cdn-snippet.md

          cat cdn-snippet.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add the CDN snippet to the GitHub Release
        # Only for a real release: a manual or test run must not edit a published release's notes.
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-body.md
          # Drop an earlier snippet (re-run), keep everything else as written.
          sed -i '/<!-- cdn-snippet:start -->/,/<!-- cdn-snippet:end -->/d' release-body.md
          # $(...) strips trailing newlines, so re-runs don't pile up blank lines.
          { printf '%s\n\n' "$(cat release-body.md)"; cat cdn-snippet.md; } > release-body-new.md
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file release-body-new.md
