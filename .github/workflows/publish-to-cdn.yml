name: Publish Package to CDN

on:
  workflow_run:
    workflows: ["Publish Package to npmjs"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mint the OIDC token AWS exchanges for short-lived creds

jobs:
  publish:
    runs-on: ubuntu-latest

    # Gate: required reviewers on the `production` environment. Also scopes the
    # AWS secrets and the OIDC trust policy's `sub`.
    environment: production

    # Only after a successful npm publish from a Release — not a `next` pre-release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - name: Build library
        run: npm run build

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-publish-to-cdn-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # Merchants pin a version together with its SRI hash, so a published version must never change:
      # a re-run or manual dispatch with differing bytes would get their script blocked.
      # Needs s3:ListBucket on the bucket (prefix libs/*) — without it this step fails, never passes.
      - name: Refuse to overwrite a published version
        env:
          BUCKET: ${{ secrets.CDN_S3_BUCKET }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          PREFIX="libs/straumur-web-component/$VERSION/"
          # Prints "None" when the prefix is empty; a failed call (e.g. AccessDenied) exits non-zero under bash -e.
          FIRST=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$PREFIX" --max-items 1 --query 'Contents[0].Key' --output text)
          if [ "$FIRST" != "None" ]; then
            echo "::error::$PREFIX already exists on the CDN. Bump the version in package.json instead of republishing."
            exit 1
          fi

      - name: Upload versioned build (immutable)
        env:
          BUCKET: ${{ secrets.CDN_S3_BUCKET }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          DEST="s3://$BUCKET/libs/straumur-web-component/$VERSION/"
          aws s3 cp dist/ "$DEST" \
            --recursive \
            --exclude "*" \
            --include "index.js" \
            --include "index.mjs" \
            --include "index.js.map" \
            --include "index.mjs.map" \
            --include "index.d.ts" \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors

      - name: Generate SRI hashes and summary
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          sri_js=$(openssl dgst -sha384 -binary dist/index.js | openssl base64 -A)
          sri_mjs=$(openssl dgst -sha384 -binary dist/index.mjs | openssl base64 -A)
          DIR="libs/straumur-web-component/$VERSION"

          {
            echo "## Straumur Web Component — CDN publish"
            echo ""
            echo "**Version:** \`$VERSION\`"
            echo ""
            echo "| Bundle | Path | Integrity |"
            echo "|---|---|---|"
            echo "| IIFE (global \`StraumurWeb\`) | \`$DIR/index.js\` | \`sha384-$sri_js\` |"
            echo "| ESM | \`$DIR/index.mjs\` | \`sha384-$sri_mjs\` |"
          } >> "$GITHUB_STEP_SUMMARY"
