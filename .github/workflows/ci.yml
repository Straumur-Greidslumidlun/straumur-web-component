name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  # Reused by publish-to-npmjs.yml so nothing is published that wouldn't pass CI.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Type-check (src + tests)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Loads the built IIFE the way a merchant page does and mounts it; checks the ESM/CJS exports.
      - name: Smoke-test dist
        run: npm run test:smoke
